# =============================================================================
# Render free-tier keep-alive (ZAXIRA)
#
# ASOSIY yechim: Cloudflare Worker + Cron Trigger
#   -> ops/render-keepalive/ (har 5 daqiqada /health ni chaqiradi)
#
# Bu GitHub Actions workflow endi zaxira sifatida qoldirilgan. GitHub scheduled
# workflow'larni kuchli kechiktirishi mumkin (ba'zan kuniga 2-3 marta), shuning
# uchun u asosiy himoya emas.
#
# Render free plan oyiga 750 instance-hour beradi; 06:00–20:00 ~420 soat/oy.
# =============================================================================

name: Server keep-alive

on:
  schedule:
    # UTC. Toshkent 06:00–20:00 = 01:00–14:59 UTC.
    - cron: '*/5 1-14 * * *'
  # Qo'lda sinash uchun: Actions → Server keep-alive → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# Bir vaqtda faqat bitta ping ishlaydi (uyg'onish 60 soniyagacha cho'zilsa,
# keyingi run navbatda kutadi).
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health
        run: |
          set -u
          url="https://boyxon-server.onrender.com/health"

          for attempt in 1 2 3; do
            # --max-time 75: cold start 30–60s, zaxira bilan.
            code=$(curl -sS -o health.json -w '%{http_code}' --max-time 75 "$url?t=$(date +%s)" || echo 000)

            if [ "$code" = "200" ] && grep -Eq '"success"[[:space:]]*:[[:space:]]*true' health.json; then
              echo "Server uyg'oq (HTTP $code), urinish: $attempt"
              exit 0
            fi

            echo "Urinish $attempt muvaffaqiyatsiz (HTTP $code) — 10s kutamiz"
            sleep 10
          done

          echo "::error::Server 3 urinishda ham javob bermadi"
          exit 1
