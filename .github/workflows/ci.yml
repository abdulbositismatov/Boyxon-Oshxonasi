name: CI — Boyxon Oshxonasi

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Bir branch uchun eski run'ni bekor qilamiz — navbat to'planmasin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Reponi yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bog'liqliklarni o'rnatish
        run: |
          npm install
          cd boyxon/server && npm install
          cd ../client && npm install

      - name: Server TypeScript tekshiruv
        run: cd boyxon/server && npm run lint

      - name: Client TypeScript tekshiruv
        run: cd boyxon/client && npm run lint

      - name: Unit testlar (narx/ETA hisobi)
        run: cd boyxon/server && npm run test:unit

      - name: Server e2e testlari
        run: cd boyxon/server && npm test

      - name: Server build
        run: cd boyxon/server && npm run build

      - name: Client build
        run: cd boyxon/client && npm run build

  security:
    name: Xavfsizlik auditi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reponi yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Server bog'liqliklari
        run: cd boyxon/server && npm install

      # `|| true` OLIB TASHLANDI: high/critical zaiflik bo'lsa CI yiqiladi.
      # Ilgari audit hech qachon muvaffaqiyatsiz bo'lmasdi — ya'ni foydasiz edi.
      - name: Server auditi (high+)
        run: cd boyxon/server && npm audit --omit=dev --audit-level=high

      - name: Client auditi (high+)
        run: cd boyxon/client && npm audit --omit=dev --audit-level=high
